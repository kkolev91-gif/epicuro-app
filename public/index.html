<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Epicuro Staff</title>
<meta name="theme-color" content="#B3121C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Epicuro">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0}
img{max-width:100%}

/* Layout: app mobile a una colonna — fascia "etichetta" verde bottiglia in alto, contenuto a schede, barra di navigazione fissa in basso */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --surface-2:#F6ECEB; --ink:#2B1214; --muted:#7A5B5E; --line:#EEDCDB;
  --band:#B3121C; --on-band:#FFFFFF; --band-muted:#F8CDD0;
  --primary:#B3121C; --on-primary:#FFFFFF;
  --ale:#D8323B; --ale-soft:#FDE9EA; --on-ale:#FFFFFF;
  --wine:#7B1E34; --straw:#C9A227; --rose:#E08C99; --fizz:#A89E5C; --other:#8A7778;
  --ok:#23784A; --ok-soft:#DFF1E6; --warn:#A35F00; --warn-soft:#FBEBD2; --bad:#B3121C; --bad-soft:#FBE3E4;
  --shadow:0 1px 2px rgba(80,10,14,.06),0 6px 18px rgba(80,10,14,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ale);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.num{font-variant-numeric:tabular-nums}

/* fascia superiore */
.band{background:var(--band);color:var(--on-band);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band-in{max-width:720px;margin:0 auto;padding-block:12px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none}
.brand{flex:1;min-width:0}
.brand h1{font-size:25px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:1px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted)}
.role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--on-band) 30%,transparent);white-space:nowrap}
.role.admin{background:var(--ale);color:var(--on-ale);border-color:transparent}

main{max-width:720px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:20px;font-weight:800}
.sec-h .eyebrow{flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.notice{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.notice b{color:var(--warn)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.ale{background:var(--ale);color:var(--on-ale);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg,.btn svg{width:18px;height:18px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

/* chip filtri */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.chip .ct{font-size:12px;opacity:.7}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.t-rosso{background:var(--wine)} .t-bianco{background:var(--straw)} .t-rose{background:var(--rose)} .t-bollicine{background:var(--fizz)} .t-altro{background:var(--other)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;font-size:16px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}

/* statistiche */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 12px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}

/* vini */
.wines{display:flex;flex-direction:column;gap:10px}
.wine{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;align-items:stretch;padding:12px 12px 12px 0;overflow:hidden}
.wine .bar{border-radius:0 4px 4px 0}
.wine .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.wine .name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.wine .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.wine .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.wine .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.qty{text-align:right;line-height:1}
.qty b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.qty small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.qty.warn b{color:var(--warn)} .qty.bad b{color:var(--bad)}
.side .btns{display:flex;gap:6px}

/* turni */
.weekbar{display:flex;align-items:center;gap:10px}
.weekbar .lbl{flex:1;text-align:center;min-width:0}
.weekbar .lbl b{display:block;font-family:var(--f-display);font-size:18px;font-weight:800}
.weekbar .lbl span{font-size:12px;color:var(--muted)}
.days{display:flex;flex-direction:column;gap:10px}
.day{overflow:hidden}
.day-h{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.day-h .d{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.day-h .d b{font-family:var(--f-display);font-size:17px;font-weight:800;text-transform:capitalize}
.day-h .d span{font-size:13px;color:var(--muted)}
.day.today .day-h{background:var(--ale-soft)}
.today-tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--primary);color:var(--on-primary);padding:2px 7px;border-radius:999px}
.shifts{display:flex;flex-direction:column}
.shift{display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;background:transparent;text-align:left;width:100%;border-top:1px solid var(--line)}
.shift:first-child{border-top:0}
.shift .who{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.shift .who small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.shift .time{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.shift.mine{background:color-mix(in srgb,var(--ale) 12%,transparent)}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.empty-day{padding:12px 14px;color:var(--muted);font-size:14px}
.hours{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.hours .h{font-variant-numeric:tabular-nums;font-weight:700}

/* oggi */
.hello h2{font-size:28px;font-weight:800;text-transform:capitalize}
.hello p{margin:4px 0 0;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.li .grow small{display:block;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:48px;height:48px;color:var(--muted)}
.empty h3{font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:34ch}

/* nav inferiore */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:0;min-width:0}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--primary)}
.nav a[aria-current="page"] .ico{background:var(--ale-soft)}
.nav .ico{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .2s}

/* foglio modale */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,14,10,.5)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:22px;font-weight:800;margin-bottom:4px}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px;width:100%}
.field textarea{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px;margin:6px 0 4px}
.stepper button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:28px;font-weight:700}
.stepper output{text-align:center;font-family:var(--f-display);font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px}
.seg.days7{grid-template-columns:repeat(7,1fr);gap:4px}
.err{margin:0;color:var(--bad);font-weight:600;font-size:14px}
.seg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (min-width:600px){.stats{gap:14px}.stat b{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* --- aggiunte app installabile --- */
html,body{height:auto}
.role{background:transparent;color:var(--on-band);display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px}
.role .avatar{width:28px;height:28px;font-size:11px}
.role.admin{background:var(--on-band);color:var(--band)}
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--band);color:var(--on-band)}
.auth-in{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:420px;width:100%;margin:0 auto;padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.auth .mark{width:64px;height:64px}
.auth h1{font-size:44px;font-weight:800;letter-spacing:-.02em}
.auth .tag{margin:4px 0 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--band-muted)}
.auth .card{color:var(--ink)}
.auth .foot{font-size:13px;color:var(--band-muted);text-align:center;margin:0}
.pwd{position:relative}
.pwd input{padding-right:84px}
.pwd button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-weight:700;font-size:13px;color:var(--muted);padding:8px}
.pubbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px}
.pubbar .txt{flex:1;min-width:200px;font-size:14px}
.pubbar .txt b{display:block;font-size:15px}
.pubbar.draft{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pubbar.live{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.banner .grow{flex:1;min-width:0;font-size:14px}
.banner .grow b{display:block;font-size:15px}
.cred{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid color-mix(in srgb,var(--on-band) 25%,transparent);border-top-color:var(--ale);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hr{height:1px;background:var(--line);margin:4px 0}


/* --- prenotazioni, meteo, calendario --- */
.welcome h2{font-size:30px;font-weight:800}
.welcome p{margin:4px 0 0;color:var(--muted);text-transform:capitalize}
.weather{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--band);color:var(--on-band);border-color:transparent}
.weather svg{width:54px;height:54px;flex:none}
.weather .t{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.weather .d{flex:1;min-width:0}
.weather .d b{display:block;font-size:16px}
.weather .d span{font-size:13px;color:var(--band-muted)}
.weather.ghost{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.daystrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.daystrip::-webkit-scrollbar{display:none}
.daybtn{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.daybtn small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.daybtn b{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.15}
.daybtn .c{font-size:11px;font-weight:700;color:var(--primary);min-height:14px;font-variant-numeric:tabular-nums}
.daybtn.today{border-color:var(--primary)}
.daybtn[aria-pressed="true"]{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.daybtn[aria-pressed="true"] small,.daybtn[aria-pressed="true"] .c{color:var(--on-primary)}
.res{display:grid;grid-template-columns:58px 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.res:first-child{border-top:0}
.res .time{font-family:var(--f-display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.res .who{min-width:0;overflow-wrap:anywhere;font-weight:700;font-size:16px}
.res .who small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.res .ppl{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:44px}
.res .ppl b{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.res .ppl small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.tel{color:var(--primary);font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.totals{display:flex;gap:16px;font-size:14px;color:var(--muted)}
.totals b{color:var(--ink);font-variant-numeric:tabular-nums}
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cal-h b{flex:1;text-align:center;font-family:var(--f-display);font-size:18px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:700;text-align:center;color:var(--muted);text-transform:uppercase;padding:4px 0}
.cal button{aspect-ratio:1;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;padding:0}
.cal button:disabled{opacity:.3}
.cal button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.cal button.today{box-shadow:inset 0 0 0 2px var(--primary)}
.unav{padding:8px 14px;font-size:13px;font-weight:600;color:var(--bad);background:var(--bad-soft);border-top:1px solid var(--line)}

/* marchio: E rossa in capitale romana, come un'iscrizione */
.mark-e{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:10px;background:#FFFFFF;color:var(--band);
  font-family:"Cinzel","Trajan Pro","Times New Roman",serif;font-weight:700;font-size:24px;line-height:1;padding-top:3px;box-shadow:inset 0 0 0 1.5px var(--band),inset 0 0 0 3px #FFFFFF,inset 0 0 0 3.8px color-mix(in srgb,var(--band) 45%,#FFFFFF)}
.mark-e.mark-lg{width:72px;height:72px;border-radius:18px;font-size:50px;padding-top:6px}
</style>
<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>

<div id="boot" class="auth"><div class="auth-in" style="text-align:center"><div class="spinner"></div></div></div>

<div id="auth" class="auth" hidden>
  <div class="auth-in">
    <div><span class="mark mark-e mark-lg" aria-hidden="true">E</span>
      <h1>Epicuro</h1><p class="tag">Birreria · Vineria · Cucina</p></div>
    <div class="card pad" id="auth-card"></div>
    <p class="foot">Via Carlo Cattaneo 12, Varese</p>
  </div>
</div>

<div id="app" hidden>
<header class="band">
  <div class="band-in">
    <span class="mark mark-e" aria-hidden="true">E</span>
    <div class="brand">
      <h1>Epicuro</h1>
      <p>Birreria · Vineria · Cucina</p>
    </div>
    <button class="role" id="role" data-act="account" aria-label="Il mio account"></button>
  </div>
</header>

<main id="main">
  <section class="view" id="v-oggi"></section>
  <section class="view" id="v-pren" hidden></section>
  <section class="view" id="v-turni" hidden></section>
  <section class="view" id="v-cantina" hidden></section>
</main>

<nav class="nav" aria-label="Sezioni">
  <div class="nav-in">
    <a href="#oggi" data-v="oggi"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></span>Home</a>
    <a href="#pren" data-v="pren"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>Prenotazioni</a>
    <a href="#turni" data-v="turni"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 13.5h3M13.5 13.5h3M7.5 17h3"/></svg></span>Turni</a>
    <a href="#cantina" data-v="cantina"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5h4v4.2c0 .9.4 1.7 1 2.3l.6.6c.9.9 1.4 2.1 1.4 3.4v7.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20.5V13c0-1.3.5-2.5 1.4-3.4L9 9c.6-.6 1-1.4 1-2.3Z"/><path d="M7 14h10"/></svg></span>Cantina</a>
  </div>
</nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet-body"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
</body>
</html>
